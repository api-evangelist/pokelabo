name: Pokelabo
description: 'Pokelabo (ポケラボ) is a Japanese mobile game development studio founded in 2007 and headquartered in Tokyo. Originally an independent social-game maker, it became a subsidiary of GREE and, as of January 1, 2025, was integrated into WFS (Wright Flyer Studios) under the GREE group. The studio develops and operates smartphone games built on licensed and original intellectual properties, including titles such as SINoALICE and Magia Exedra (Puella Magi Madoka Magica). Pokelabo is a consumer entertainment company and does not expose a public developer API; this profile captures its identity and domain-security posture for the API Evangelist network.'
